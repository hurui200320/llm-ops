name: strata-image

# Builds a Strata (AMD HIP, RDNA 3: gfx1100 / gfx1101 / gfx1102) image for the llm-ops lanes and pushes it to GHCR.
#
# Upstream builds these images from signed release engine packages with docker/build.sh (nothing is compiled), but
# since 0.2.5 it ships one engine-less installer per OS and has published no Docker image at all after 0.2.3. This
# workflow therefore:
#
#   1. fetches the released qwen engine package through upstream's own docker/fetch-engines.py — the signed feed,
#      the archive's SHA-256, the manifest hash, the package signature and every file are checked there — so the
#      engine is byte-identical to what upstream puts in its own images;
#   2. builds the image with upstream's docker/build.sh from the same tag, and smoke-tests it in-image.
#
# The result is exactly what an upstream 0.2.10-rocm-gfx110x build assembles: the released package, the Terminal
# from the same tag, nothing added. (Until 2026-11-04 the workflow also compiled a gfx110x `strata-dsv41` DeepSeek
# engine into the image with the TheRock ROCm wheels; the DeepSeek lane moved to Project Maya that day
# (notes/maya.md 20261104) and the build was removed — the record: notes/strata.md 20261104.) The Dockerfile's
# verify stage re-checks the package (every listed file, binary_deps on every ELF, ldd in the image).
#
# The upstream versions are PINNED in `env:` below, not workflow inputs: the image is bound to one Strata source tag
# and one released engine package. The package gate is written against exactly that combination, so moving any of
# them is a reviewed code change.
#
# No source patch is applied: the nested-tools build-context gap that v0.2.4.1 introduced (the Terminal stage died with
# "installer tool missing: tools/dsv41/tune.py") was fixed upstream in v0.2.7 by PR #3974 by hurui200320, and
# docker/build.sh in this tag stages tools/**/*.py by itself.
#
# Manual trigger only. See deploy/strata/README.md for the run recipe and deploy/strata/entrypoint-local.sh for the
# entrypoint fork that must be re-diffed on every image bump.

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to GHCR (off: build and smoke-test only)"
        required: true
        default: true
        type: boolean

# The upstream pins: a workflow input must not be able to pair a source tag with a package, ROCm line or tuning
# table it was not built against. Move them here as one reviewed change (see the header and deploy/strata/README.md).
env:
  IMAGE: ghcr.io/hurui200320/llm-ops-strata
  STRATA_REPO: Niko1221/Strata
  # Terminal sources and the Dockerfile.
  STRATA_REF: v0.2.10
  # The release that carries the signed feed and the Qwen engine packages. v0.2.10 rebuilds EVERY engine package
  # at 0.1.56: the rx7900 engine folder changes 0.1.55 -> 0.1.56 and every lane re-runs setup once. The package now
  # also ships the all-cards split engine (strata-split-2/3/4-amd, ~+49 MB), whose Auto rule never selects 2x gfx1100
  # on IQ3_S. What matters here: 0.1.56 adds the DFlash2 block drafter on gfx1100 (`--draft dflash2`, also on a layer
  # split, one request at a time), the serve fixes (#4677 conversation park, #4590 penalty window, #4701/#4751 tool
  # parsing) and #4846 (arena lock under RAM pressure). The packaged gfx1100 hipBLASLt table still reads 100200 and
  # the rx7900 package keeps TheRock 7.10.0a20251120 (only the rx9070 package moved to 7.13). The package is
  # re-verified against the feed below (signature, manifest hash).
  ENGINE_RELEASE: v0.2.10
  # hipBLASLt version the package's gfx1100 tuning table must match (BUILD.json hipblaslt_version).
  HIPBLASLT_TABLE_VERSION: "100200"

permissions:
  contents: read

concurrency:
  group: strata-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test the HIP image
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out this repository (this workflow)
        uses: actions/checkout@v4

      - name: Check out Strata at the pinned tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.STRATA_REPO }}
          ref: ${{ env.STRATA_REF }}
          path: strata
          fetch-depth: 1
          persist-credentials: false

      - name: Derive the image tag and record the commit
        run: |
          set -euo pipefail
          tag="${STRATA_REF#v}-rocm-gfx110x"
          {
            echo "IMAGE_TAG=$tag"
            echo "IMAGE_VERSION=${STRATA_REF#v}"
            echo "STRATA_COMMIT=$(git -C strata rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          echo "image: $IMAGE:$tag (version label ${STRATA_REF#v})"

      - name: Free disk space (the image and docker's cache need headroom)
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Fetch the released qwen engine package (signed feed, every file verified)
        run: |
          set -euo pipefail
          python3 strata/docker/fetch-engines.py --release-tag "$ENGINE_RELEASE" \
            --flavors rocm-gfx110x --out pkgs > fetch.out
          cat fetch.out
          line="$(tail -1 fetch.out)"
          flavor="$(printf '%s' "$line" | cut -f1)"
          folder="$(printf '%s' "$line" | cut -f3)"
          [ "$flavor" = "rocm-gfx110x" ] || { echo "unexpected fetch output: $line" >&2; exit 1; }
          [ -f "$folder/engine-component.json" ] || { echo "no package folder in: $line" >&2; exit 1; }
          echo "PKG_DIR=$PWD/$folder" >> "$GITHUB_ENV"

      - name: "Gate: the package is the release's rx7900 engine and its gfx1100 tuning table"
        env:
          TABLE_VERSION: ${{ env.HIPBLASLT_TABLE_VERSION }}
        run: |
          set -euo pipefail
          python3 - "$PKG_DIR" <<'PY'
          import hashlib, json, os, pathlib, sys

          pkg = pathlib.Path(sys.argv[1])
          m = json.loads((pkg / "engine-component.json").read_text(encoding="utf-8"))
          assert m.get("id") == "strata-engine", f"id {m.get('id')!r}"
          assert m.get("platform") == "linux-x86_64", f"platform {m.get('platform')!r}"
          assert m.get("backend") == "hip", f"backend {m.get('backend')!r}"
          assert m.get("variant") == "rx7900", f"variant {m.get('variant')!r}"
          archs = m.get("archs") or []
          for want in ("gfx1100", "gfx1101", "gfx1102"):
              assert want in archs, f"{want} is not in archs {archs}"
          assert m.get("entrypoint") == "strata", f"entrypoint {m.get('entrypoint')!r}"
          assert m.get("files"), "the manifest lists no files"

          build = json.loads((pkg / "BUILD.json").read_text(encoding="utf-8"))
          assert build.get("version") == m.get("version"), (
              f"BUILD.json version {build.get('version')!r} != manifest version {m.get('version')!r}")
          assert build.get("variant") == "rx7900", f"BUILD.json variant {build.get('variant')!r}"
          want = int(os.environ["TABLE_VERSION"])
          got = build.get("hipblaslt_version")
          assert got == want, f"BUILD.json hipblaslt_version {got!r} != pinned {want}"

          table = pkg / "tuning" / f"gfx1100-hipblaslt-{want}.txt"
          assert table.is_file(), f"{table} is missing: this package would run plain hipBLAS"
          entry = next((f for f in m["files"] if f.get("path") == f"tuning/{table.name}"), None)
          assert entry is not None, f"tuning/{table.name} is not listed in engine-component.json"
          digest = hashlib.sha256(table.read_bytes()).hexdigest()
          assert digest == entry.get("sha256"), f"{table.name} sha256 {digest} != manifest {entry.get('sha256')}"
          print(f"package OK: engine {m['version']} variant={m.get('variant')} archs={archs} files={len(m['files'])}")
          print(f"tuning/{table.name} sha256={digest}")
          PY
          version="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"])' "$PKG_DIR/engine-component.json")"
          {
            echo "PKG_VERSION=$version"
            echo "ENGINE_MANIFEST_SHA=$(sha256sum "$PKG_DIR/engine-component.json" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Build the image from the engine package (nothing else is compiled)
        run: |
          set -euo pipefail
          strata/docker/build.sh --flavor hip --engine "$PKG_DIR" --repo strata \
            --version "$IMAGE_VERSION" --tag "$IMAGE:$IMAGE_TAG"
          docker image inspect "$IMAGE:$IMAGE_TAG" --format 'built {{.RepoTags}} {{.Size}} bytes'

      - name: In-image smoke test (Terminal, component inventory)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /opt/strata/terminal/bin/strata "$IMAGE:$IMAGE_TAG" --version
          mkdir -p smoke-data
          set +e
          # --backend hip: the runner has no GPU to detect; naming the backend makes the package resolve through the
          # platform gate, the signature policy and the entrypoint hash, exactly as it does on a gfx1100 host.
          # --full hashes every file of the package (its manifest), not only the entrypoint.
          docker run --rm -v "$PWD/smoke-data:/data" --entrypoint /opt/strata/terminal/bin/strata \
            "$IMAGE:$IMAGE_TAG" components engine --backend hip --full --output json > engine-list.json
          rc=$?
          set -e
          echo "strata components engine exit code: $rc (0 = the package resolved for the HIP backend)"
          python3 - "$rc" engine-list.json "$PKG_VERSION" <<'PY'
          import json, sys

          rc, path, version = sys.argv[1], sys.argv[2], sys.argv[3]
          data = json.load(open(path, encoding="utf-8"))
          installed = [f"{i.get('version')} {i.get('platform')}-{i.get('backend')}" for i in data.get("installed") or []]
          print("component inventory:", installed)
          assert any(i.get("version") == version for i in data.get("installed") or []), (
              f"engine {version} is not in the inventory")
          problems = [str(p) for p in (data.get("problems") or [])]
          assert not problems, f"the component folder reports problems: {problems}"
          assert data.get("usable") is True, (
              f"the engine did not resolve for the HIP backend (exit code {rc}): {data.get('notice')!r}")
          assert data.get("engine", {}).get("version") == version, (
              f"the resolved engine says {data.get('engine')!r}, not {version}")
          print("component inventory OK")
          PY

      - name: Record the entrypoint fork drift (re-apply the fork on every image bump)
        if: ${{ always() }}
        run: |
          {
            echo "### entrypoint fork"
            echo ""
            echo "deploy/strata/entrypoint-local.sh is upstream's /opt/strata/entrypoint.sh plus five changes"
            echo "(--no-api-key when no key is set, no false \"made one\" warning, the pack chat-template swap,"
            echo "the picture-reader token budget, and the DRAFTING launch flag)."
            echo "The diff below is expected to be non-empty; if upstream changed anything beyond those five,"
            echo "re-apply the fork before the first start."
            echo '```diff'
            diff -u strata/docker/entrypoint.sh deploy/strata/entrypoint-local.sh | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: ${{ inputs.push }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$IMAGE_TAG"
          docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$IMAGE_TAG"

      - name: Summary
        if: ${{ always() }}
        env:
          PUSHED: ${{ inputs.push }}
        run: |
          {
            echo "### Strata image"
            echo ""
            echo "- image: \`${IMAGE}:${IMAGE_TAG:-?}\` (version label \`${IMAGE_VERSION:-?}\`, pushed: ${PUSHED})"
            echo "- Strata sources \`${STRATA_REF}\` (${STRATA_COMMIT:-?})"
            echo "- release \`${ENGINE_RELEASE}\`: engine package ${PKG_VERSION:-?}, manifest sha256 \`${ENGINE_MANIFEST_SHA:-?}\`"
          } >> "$GITHUB_STEP_SUMMARY"
