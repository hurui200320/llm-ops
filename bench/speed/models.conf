# Per-model configuration for run_bench.sh, sourced as bash.
#
# model_config <key> must set:
#   MODEL   - gguf path as seen inside the container (under /models)
#   BACKEND - rocm | vulkan (selects the docker image and device flags)
#   FLAGS   - llama-bench test parameters, mirroring deploy/llama-swap.config.yaml
#   DEPTHS  - comma-separated context depths for -d
#
# Notes:
# - llama-bench auto-sizes the context to fit depth+prompt+gen; there is no -c flag.
# - Server-only flags have no llama-bench equivalent and are intentionally dropped:
#   --cache-ram, --ctx-checkpoints, --parallel, --no-kv-unified, chat template,
#   sampling params, --mmproj (llama-bench exercises the text path only).
#   Keep FLAGS to what llama-bench supports (see its README).
# - --load-mode IS supported by llama-bench (as -lm); FLAGS mirror the
#   deployment's explicit --load-mode mmap instead of relying on the auto default.
# - llama-bench cannot do speculative decoding (no --spec-type/--model-draft
#   support), so spec configs are measured as base speed here. Use
#   run_speed_bench.sh for baseline-vs-spec comparisons.
# - NOTE: -ts separates GPUs with '/' (llama-bench syntax). llama-server's
#   --tensor-split uses ',' instead; a comma here would be parsed as N separate
#   single-GPU test configs instead of one multi-GPU split.

model_config() {
    case "$1" in
        gemma4-31b-q5km)
            BACKEND=rocm
            MODEL=/models/gemma-4/google-31B-it/google_gemma-4-31B-it-Q5_K_M.gguf
            FLAGS="-ngl 99 -mg 0 -sm layer -ts 30/31 -b 2048 -ub 256 -fa on -lm mmap"
            DEPTHS="0,32768,131072,235000"
            ;;
        gemma4-26b-a4b-q80)
            BACKEND=rocm
            MODEL=/models/gemma-4/google-26B-A4B-it/google_gemma-4-26B-A4B-it-Q8_0.gguf
            FLAGS="-ngl 99 -mg 0 -sm layer -ts 13/18 -b 2048 -ub 1024 -fa on -lm mmap"
            DEPTHS="0,32768,131072,235000"
            ;;
        gemma4-31b-qat-q40)
            BACKEND=rocm
            MODEL=/models/gemma-4/google-31B-it-qat-q40-unsloth/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
            FLAGS="-ngl 99 -mg 0 -sm layer -ts 29/32 -b 2048 -ub 1280 -fa on -lm mmap"
            DEPTHS="0,32768,131072,235000"
            ;;
        muse-glimmer-30b)
            # Deployment uses DFlash draft (--spec-type draft-dflash); llama-bench
            # measures base speed only. Per-slot context in production is 131072
            # (524288 / parallel 4), so depths stop at 90% of that, rounded to 118000.
            BACKEND=rocm
            MODEL=/models/muse-glimmer/meta-30b/Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf
            FLAGS="-ngl 53 -mg 0 -sm layer -ts 26/27 -b 4096 -ub 2048 -fa on -lm mmap"
            DEPTHS="0,32768,118000"
            ;;
        ornith15-35b-a3b-q80)
            BACKEND=rocm
            MODEL=/models/ornith-1.5/ornith-35B-A3B/Ornith-1.5-35B-A3B-Q8_0.gguf
            FLAGS="-ngl 99 -mg 0 -sm layer -ts 20/22 -b 1024 -ub 512 -fa on -lm mmap"
            DEPTHS="0,32768,131072,235000"
            ;;
        ornith15-35b-a3b-abliterated-q80)
            BACKEND=rocm
            MODEL=/models/ornith-1.5/pocketaihub-35B-A3B-Abliterated/Ornith-1.5-35B-A3B-Abliterated-Q8_0.gguf
            FLAGS="-ngl 99 -mg 0 -sm layer -ts 20/22 -b 1024 -ub 512 -fa on -lm mmap"
            DEPTHS="0,32768,131072,235000"
            ;;
        *)
            return 1
            ;;
    esac
}

model_keys() {
    printf '%s\n' \
        gemma4-31b-q5km \
        gemma4-26b-a4b-q80 \
        gemma4-31b-qat-q40 \
        muse-glimmer-30b \
        ornith15-35b-a3b-q80 \
        ornith15-35b-a3b-abliterated-q80
}
