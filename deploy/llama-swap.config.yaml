# add this modeline for validation in vscode
# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# llama-swap YAML configuration example
# -------------------------------------
#
# 💡 Tip - Use an LLM with this file!
# ====================================
#  This example configuration is written to be LLM friendly. Try
#  copying this file into an LLM and asking it to explain or generate
#  sections for you.
# ====================================

# Usage notes:
# - Below are all the available configuration options for llama-swap.
# - Settings noted as "required" must be in your configuration file
# - Settings noted as "optional" can be omitted

# healthCheckTimeout: number of seconds to wait for a model to be ready to serve requests
# - optional, default: 120
# - minimum value is 15 seconds, anything less will be set to this value
healthCheckTimeout: 120

# logLevel: sets the logging value
# - optional, default: info
# - Valid log levels: debug, info, warn, error
logLevel: info

# logTimeFormat: enables and sets the logging timestamp format
# - optional, default (disabled): ""
# - Valid values: "", "ansic", "unixdate", "rubydate", "rfc822", "rfc822z",
#   "rfc850", "rfc1123", "rfc1123z", "rfc3339", "rfc3339nano", "kitchen",
#   "stamp", "stampmilli", "stampmicro", and "stampnano".
# - For more info, read: https://pkg.go.dev/time#pkg-constants
logTimeFormat: "ansic"

# logToStdout: controls what is logged to stdout
# - optional, default: "proxy"
# - valid values:
#   - "proxy": logs generated by llama-swap when swapping models,
#      handling requests, etc.
#   - "upstream": a copy of an upstream processes stdout logs
#   - "both": both the proxy and upstream logs interleaved together
#   - "none": no logs are ever written to stdout
logToStdout: "proxy"

# metricsMaxInMemory: maximum number of metrics to keep in memory
# - optional, default: 1000
# - controls how many metrics are stored in memory before older ones are discarded
# - useful for limiting memory usage when processing large volumes of metrics
metricsMaxInMemory: 1000

# captureBuffer: how many MBs to allocate for storing request/response captures
# - optional, default: 10
# - set to 0 to disable
captureBuffer: 256

# startPort: sets the starting port number for the automatic ${PORT} macro.
# - optional, default: 5800
# - the ${PORT} macro can be used in model.cmd and model.proxy settings
# - it is automatically incremented for every model that uses it
startPort: 10001


# globalTTL: the default TTL in seconds before unloading a model
# - optional, default: 0 (never automatically unload)
# - must be >= 0
globalTTL: 0

# macros: a dictionary of string substitutions
# - optional, default: empty dictionary
# - macros are reusable snippets
# - used in a model's cmd, cmdStop, proxy, checkEndpoint, filters.stripParams
# - useful for reducing common configuration settings
# - macro names are strings and must be less than 64 characters
# - macro names must match the regex ^[a-zA-Z0-9_-]+$
# - macro names must not be a reserved name: PORT or MODEL_ID
# - macro values can be numbers, bools, or strings
# - macros can contain other macros, but they must be defined before they are used
# - environment variables can be referenced with ${env.VAR_NAME} syntax
#   - env macros are substituted first, before regular macros
#   - if the env var is not set, config loading will fail with an error
macros:
  # common start of docker run llama server
  "docker-server-rocm": >
    docker run --name ${MODEL_ID} --init --rm
      --device /dev/dri
      --device /dev/kfd
      --group-add=video
      --group-add=render
      --security-opt label=disable
      --security-opt seccomp=unconfined
      -p ${PORT}:8080
      -v /mnt/unenc-xfs/models:/models:z
      -v /mnt/unenc-xfs/llm-ops/templates:/templates:z
      ghcr.io/ggml-org/llama.cpp:full-rocm
      --server
      --port 8080 --host 0.0.0.0
      --alias ${MODEL_ID}
      -lv 4

  # vulkan backend for qwen-arch models (qwen3.5/3.6, ornith 1.5).
  # Historically faster than rocm for qwen arch on AMD GPUs; keep for A/B testing.
  "docker-server-vulkan": >
    docker run --name ${MODEL_ID} --init --rm
      --device /dev/dri
      --group-add=video
      --group-add=render
      --security-opt label=disable
      --security-opt seccomp=unconfined
      -p 127.0.0.1:${PORT}:8080
      -v /mnt/unenc-xfs/models:/models:z
      -v /mnt/unenc-xfs/llm-ops/templates:/templates:z
      ghcr.io/ggml-org/llama.cpp:full-vulkan
      --server
      --port 8080 --host 0.0.0.0
      --alias ${MODEL_ID}
      -lv 4

  # cache and ctx-checkpoint settings for gemma 4
  # ctx-checkpoint will be huge since gemma 4 has a lot of standard attn layer
  # so we have to shrink the number of ckpts (default to 32) to reduce RAM usage, otherwise get OOM kill
  # on gemma 4 31b, each checkpoint takes 1GB of RAM
  "gemma4-ctx-ckpt": >
    --cache-ram 0
    --ctx-checkpoints 20
    --checkpoint-min-step 13107

  # cache and ctx-checkpoint settings for muse glimmer 30B and ornith 1.5 35B-A3B
  # 32 checkpoints x 8192 t/ckpt = 256K context coverage.
  "muse-ornith15-ctx-ckpt": >
    --cache-ram 8192
    --ctx-checkpoints 32
    --checkpoint-min-step 8192

# apiKeys: require an API key when making requests to inference endpoints
# - optional, default: []
# - when empty (the default) authorization will not be checked as llama-swap is default-allow
# - each key is a non-empty string
apiKeys: []

# models: a dictionary of model configurations
# - required
# - each key is the model's ID, used in API requests
# - model settings have default values that are used if they are not defined here
# - the model's ID is available in the ${MODEL_ID} macro, also available in macros defined above
# - below are examples of the all the settings a model can have
models:
  "google-gemma-4-31b-q5km-text":
    name: "Google Gemma 4 31B Q5_K_M text"
    description: "256K context, no vision"
    cmd: |
      ${docker-server-rocm}
        ${gemma4-ctx-ckpt}
        --model                 /models/gemma-4/google-31B-it/google_gemma-4-31B-it-Q5_K_M.gguf
        --chat-template-file /templates/gemma-4/31B-chat-template.jinja
        --jinja
        --reasoning on
        -b 2048 -ub 256
        -ngl 99
        --main-gpu 0 --split-mode layer --tensor-split 30,31
        --ctx-size 262144
        --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0.0 --repeat-penalty 1.0
        --load-mode mmap
        --no-kv-unified
        --flash-attn on
        --parallel 1
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    concurrencyLimit: 2
    timeouts:
      connect: 30
      keepalive: 30
      # pp may take a long time so we don't set a timeout here
      responseHeader: 0
      tlsHandshake: 10
      idleConn: 90


  "google-gemma-4-26b-a4b-q80-vision":
    name: "Gemma 4 26B A4B Q8_0 vision"
    description: "256K context, vision, image 560 tokens"
    cmd: |
      ${docker-server-rocm}
        ${gemma4-ctx-ckpt}
        --model                 /models/gemma-4/google-26B-A4B-it/google_gemma-4-26B-A4B-it-Q8_0.gguf
        --mmproj                /models/gemma-4/google-26B-A4B-it/mmproj-google_gemma-4-26B-A4B-it-bf16.gguf
        --chat-template-file /templates/gemma-4/26B-chat-template.jinja
        --jinja
        --reasoning on
        -b 2048 -ub 1024
        --image-min-tokens 560 --image-max-tokens 560
        -ngl 99
        --main-gpu 0 --split-mode layer --tensor-split 13,18
        --ctx-size 262144
        --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0.0 --repeat-penalty 1.0
        --load-mode mmap
        --no-kv-unified
        --flash-attn on
        --parallel 1
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    concurrencyLimit: 2
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 0
      tlsHandshake: 10
      idleConn: 90


  # The official QAT Q4 for Gemma 4 31B
  "google-gemma-4-31b-qat-q40-vision":
    name: "Google Gemma 4 31B QAT Q4_0 vision"
    description: "256K context, with vision"
    cmd: |
      ${docker-server-rocm}
        ${gemma4-ctx-ckpt}
        --model                 /models/gemma-4/google-31B-it-qat-q40-unsloth/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
        --mmproj                /models/gemma-4/google-31B-it-qat-q40-unsloth/mmproj-BF16.gguf
        --chat-template-file /templates/gemma-4/31B-chat-template.jinja
        --jinja
        --reasoning on
        -b 2048 -ub 1280
        --image-min-tokens 560 --image-max-tokens 560
        -ngl 99
        --main-gpu 0 --split-mode layer --tensor-split 29,32
        --ctx-size 262144
        --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0.0 --repeat-penalty 1.0
        --load-mode mmap
        --no-kv-unified
        --flash-attn on
        --parallel 1
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    concurrencyLimit: 2
    timeouts:
      connect: 30
      keepalive: 30
      # pp may take a long time so we don't set a timeout here
      responseHeader: 0
      tlsHandshake: 10
      idleConn: 90


  # Muse Glimmer 30B kquant-dynamic with vision + DFlash speculative draft.
  # Max context 131072 per slot; ctx-size 524288 / parallel 4 = 131072 per slot.
  "meta-muse-glimmer-30b-kquant-vision":
    name: "Meta Muse Glimmer 30B kquant-dynamic vision"
    description: "128K context per slot (524288 total, parallel 4), vision, DFlash draft"
    cmd: |
      ${docker-server-rocm}
        ${muse-ornith15-ctx-ckpt}
        --model                 /models/muse-glimmer/meta-30b/Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf
        --mmproj                /models/muse-glimmer/meta-30b/mmproj-Muse-Glimmer-30B-Q4_K_M.gguf
        --model-draft           /models/muse-glimmer/meta-30b/dflash-Muse-Glimmer-30B-Q4_K_M.gguf
        --chat-template-file /templates/muse-glimmer/30B-chat-template.jinja
        --spec-type draft-dflash --spec-draft-n-max 2
        --jinja
        --reasoning on
        -b 4096 -ub 2048
        --image-min-tokens 512 --image-max-tokens 4096
        -ngl 53
        --main-gpu 0 --split-mode layer --tensor-split 26,27
        --ctx-size 524288
        --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0.0 --repeat-penalty 1.0
        --load-mode mmap
        --no-kv-unified
        --flash-attn on
        --parallel 4
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    concurrencyLimit: 5
    timeouts:
      connect: 30
      keepalive: 30
      # pp may take a long time so we don't set a timeout here
      responseHeader: 0
      tlsHandshake: 10
      idleConn: 90


  # Ornith 1.5 35B-A3B official Q8_0 with vision.
  # Backend note: tested rocm; qwen arch historically faster on vulkan.
  # TODO(backend A/B): compare rocm vs vulkan pp/tg before locking backend.
  # MTP is built into the GGUF but measured slower (pp 1892 vs 2397, tg 30.6 vs 34.5):
  # VRAM was too tight, so llama-server fought the desktop stack (gnome shell)
  # for VRAM and everything slowed down. Spec stays off until there is real
  # headroom; re-enable with --spec-type draft-mtp and re-verify with bench/speed.
  "ornith-1.5-35b-a3b-q80-vision":
    name: "Ornith 1.5 35B-A3B Q8_0 vision"
    description: "256K context, vision, MoE 35B total / 3B active"
    cmd: |
      ${docker-server-rocm}
        ${muse-ornith15-ctx-ckpt}
        --model                 /models/ornith-1.5/ornith-35B-A3B/Ornith-1.5-35B-A3B-Q8_0.gguf
        --mmproj                /models/ornith-1.5/ornith-35B-A3B/mmproj-Ornith-1.5-35B-A3B-bf16.gguf
        --chat-template-file /templates/ornith-1.5/35B-chat-template.jinja
        --jinja
        --spec-type none
        --reasoning on
        -b 1024 -ub 512
        --image-min-tokens 512 --image-max-tokens 4096
        -ngl 99
        --main-gpu 0 --split-mode layer --tensor-split 20,22
        --ctx-size 262144
        --temp 0.9 --top-p 0.95 --top-k 40 --min-p 0.01 --repeat-penalty 1.0 --presence-penalty 1.2
        --load-mode mmap
        --no-kv-unified
        --flash-attn on
        --parallel 1
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    concurrencyLimit: 2
    timeouts:
      connect: 30
      keepalive: 30
      # pp may take a long time so we don't set a timeout here
      responseHeader: 0
      tlsHandshake: 10
      idleConn: 90


  # Ornith 1.5 35B-A3B Abliterated (uncensored) Q8_0 with vision.
  # This GGUF has no MTP head, so no --spec-type flag.
  "ornith-1.5-35b-a3b-abliterated-q80-vision":
    name: "Ornith 1.5 35B-A3B Abliterated Q8_0 vision"
    description: "256K context, vision, uncensored, MoE 35B total / 3B active"
    cmd: |
      ${docker-server-rocm}
        ${muse-ornith15-ctx-ckpt}
        --model                 /models/ornith-1.5/pocketaihub-35B-A3B-Abliterated/Ornith-1.5-35B-A3B-Abliterated-Q8_0.gguf
        --mmproj                /models/ornith-1.5/pocketaihub-35B-A3B-Abliterated/mmproj-Ornith-1.5-35B-A3B-Abliterated-F16.gguf
        --chat-template-file /templates/ornith-1.5/35B-chat-template.jinja
        --jinja
        --reasoning on
        -b 1024 -ub 512
        --image-min-tokens 512 --image-max-tokens 4096
        -ngl 99
        --main-gpu 0 --split-mode layer --tensor-split 20,22
        --ctx-size 262144
        --temp 0.9 --top-p 0.95 --top-k 40 --min-p 0.01 --repeat-penalty 1.0 --presence-penalty 1.2
        --load-mode mmap
        --no-kv-unified
        --flash-attn on
        --parallel 1
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    concurrencyLimit: 2
    timeouts:
      connect: 30
      keepalive: 30
      # pp may take a long time so we don't set a timeout here
      responseHeader: 0
      tlsHandshake: 10
      idleConn: 90


  # Qwen3.8 27B with built-in mtp
  "qwen3.8-27b-q80-vision-mtp":
    name: "Qwen3.8 27B Q8_0 vision"
    description: "256K context, vision"
    cmd: |
      ${docker-server-rocm}
        ${muse-ornith15-ctx-ckpt}
        --model                 /models/qwen3.8/unsloth-27B/Qwen3.8-27B-Q8_0.gguf
        --mmproj                /models/qwen3.8/unsloth-27B/mmproj-BF16.gguf
        --chat-template-file /templates/qwen3.8/27B-chat-template.jinja
        --spec-type draft-mtp --spec-draft-n-max 2
        --jinja
        --reasoning on
        -b 1024 -ub 256
        --image-min-tokens 1024 --image-max-tokens 4096
        -ngl 99
        --main-gpu 0 --split-mode layer --tensor-split 33,33
        --ctx-size 262144
        --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --repeat-penalty 1.0 --presence-penalty 0.0
        --load-mode mmap
        --no-kv-unified
        --flash-attn on
        --parallel 1
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    concurrencyLimit: 2
    timeouts:
      connect: 30
      keepalive: 30
      # pp may take a long time so we don't set a timeout here
      responseHeader: 0
      tlsHandshake: 10
      idleConn: 90


  # Qwen3.8 27B without mtp. Not enough VRAM for MTP, enable it will slow down
  "qwen3.8-27b-q80-vision":
    name: "Qwen3.8 27B Q8_0 vision"
    description: "256K context, vision"
    cmd: |
      ${docker-server-rocm}
        ${muse-ornith15-ctx-ckpt}
        --model                 /models/qwen3.8/unsloth-27B/Qwen3.8-27B-Q8_0.gguf
        --mmproj                /models/qwen3.8/unsloth-27B/mmproj-BF16.gguf
        --chat-template-file /templates/qwen3.8/27B-chat-template.jinja
        --spec-type none
        --jinja
        --reasoning on
        -b 1024 -ub 512
        --image-min-tokens 1024 --image-max-tokens 4096
        -ngl 99
        --main-gpu 0 --split-mode layer --tensor-split 32,34
        --ctx-size 262144
        --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --repeat-penalty 1.0 --presence-penalty 0.0
        --load-mode mmap
        --no-kv-unified
        --flash-attn on
        --parallel 1
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    concurrencyLimit: 2
    timeouts:
      connect: 30
      keepalive: 30
      # pp may take a long time so we don't set a timeout here
      responseHeader: 0
      tlsHandshake: 10
      idleConn: 90


  # Qwen3.8 27B uncensored
  "qwen3.8-27b-uncensored-q80-vision":
    name: "Qwen3.8 27B uncensored Q8_0 vision"
    description: "256K context, vision, uncensored"
    cmd: |
      ${docker-server-rocm}
        ${muse-ornith15-ctx-ckpt}
        --model                 /models/qwen3.8/orcarouter-27B-uncensored/Qwen3.8-27B-Uncensored-Q8_0.gguf
        --mmproj                /models/qwen3.8/orcarouter-27B-uncensored/mmproj-Qwen3.8-27B-Uncensored-f16.gguf
