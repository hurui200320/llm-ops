# add this modeline for validation in vscode
# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# llama-swap YAML configuration example
# -------------------------------------
#
# 💡 Tip - Use an LLM with this file!
# ====================================
#  This example configuration is written to be LLM friendly. Try
#  copying this file into an LLM and asking it to explain or generate
#  sections for you.
# ====================================

# Usage notes:
# - Below are all the available configuration options for llama-swap.
# - Settings noted as "required" must be in your configuration file
# - Settings noted as "optional" can be omitted

# healthCheckTimeout: number of seconds to wait for a model to be ready to serve requests
# - optional, default: 120
# - minimum value is 15 seconds, anything less will be set to this value
healthCheckTimeout: 120

# logLevel: sets the logging value
# - optional, default: info
# - Valid log levels: debug, info, warn, error
logLevel: info

# logTimeFormat: enables and sets the logging timestamp format
# - optional, default (disabled): ""
# - Valid values: "", "ansic", "unixdate", "rubydate", "rfc822", "rfc822z",
#   "rfc850", "rfc1123", "rfc1123z", "rfc3339", "rfc3339nano", "kitchen",
#   "stamp", "stampmilli", "stampmicro", and "stampnano".
# - For more info, read: https://pkg.go.dev/time#pkg-constants
logTimeFormat: "ansic"

# logToStdout: controls what is logged to stdout
# - optional, default: "proxy"
# - valid values:
#   - "proxy": logs generated by llama-swap when swapping models,
#      handling requests, etc.
#   - "upstream": a copy of an upstream processes stdout logs
#   - "both": both the proxy and upstream logs interleaved together
#   - "none": no logs are ever written to stdout
logToStdout: "proxy"

# metricsMaxInMemory: maximum number of metrics to keep in memory
# - optional, default: 1000
# - controls how many metrics are stored in memory before older ones are discarded
# - useful for limiting memory usage when processing large volumes of metrics
metricsMaxInMemory: 1000

# captureBuffer: how many MBs to allocate for storing request/response captures
# - optional, default: 10
# - set to 0 to disable
captureBuffer: 256

# startPort: sets the starting port number for the automatic ${PORT} macro.
# - optional, default: 5800
# - the ${PORT} macro can be used in model.cmd and model.proxy settings
# - it is automatically incremented for every model that uses it
startPort: 10001


# globalTTL: the default TTL in seconds before unloading a model
# - optional, default: 0 (never automatically unload)
# - must be >= 0
globalTTL: 0

# macros: a dictionary of string substitutions
# - optional, default: empty dictionary
# - macros are reusable snippets
# - used in a model's cmd, cmdStop, proxy, checkEndpoint, filters.stripParams
# - useful for reducing common configuration settings
# - macro names are strings and must be less than 64 characters
# - macro names must match the regex ^[a-zA-Z0-9_-]+$
# - macro names must not be a reserved name: PORT or MODEL_ID
# - macro values can be numbers, bools, or strings
# - macros can contain other macros, but they must be defined before they are used
# - environment variables can be referenced with ${env.VAR_NAME} syntax
#   - env macros are substituted first, before regular macros
#   - if the env var is not set, config loading will fail with an error
macros:
  # Host RAM 32 GiB with 32GB swap; VRAM is unaffected.
  # Target and draft KV caches deliberately retain their original F16 defaults.
  # Reuse ROCm compilation results across disposable containers. The named
  # volume is local to Docker; no model weights or conversation state go here.
  # Do not add prune_expiration: this COMGR build rejects it and disables caching.
  # Placement/context are explicit: skip auto-fit estimates, keep warmup enabled.
  # common start of docker run llama server
  "docker-server-rocm": >
    docker run --name ${MODEL_ID} --init --rm
      --memory 32g --memory-swap 64g
      -v llm-ops-comgr-cache:/root/.cache/comgr
      -e AMD_COMGR_CACHE=1
      -e AMD_COMGR_CACHE_DIR=/root/.cache/comgr
      -e AMD_COMGR_CACHE_POLICY=prune_interval=1h:cache_size=0%:cache_size_bytes=256m:cache_size_files=0
      --device /dev/dri
      --device /dev/kfd
      --group-add=video
      --group-add=render
      --security-opt label=disable
      --security-opt seccomp=unconfined
      -p ${PORT}:8080
      -v /mnt/unenc-xfs/models:/models:z
      -v /mnt/unenc-xfs/llm-ops/templates:/templates:z
      ghcr.io/ggml-org/llama.cpp:full-rocm
      --server
      --port 8080 --host 0.0.0.0
      --alias ${MODEL_ID}
      -lv 3
      --fit off


  # Host-RAM checkpoints are separate from the saved-prompt --cache-ram budget.
  # Gemma's partial checkpoints save SWA state, not the global-attention cache.
  # The count is per slot; keep a bounded number to leave RAM for model loading.
  "gemma4-26b-ctx-ckpt": >
    --cache-ram 40960
    --ctx-checkpoints 20
    --checkpoint-min-step 13107

  # 31B partial checkpoints are 800 MiB each, vs 200 MiB for 26B.
  # Sixteen checkpoints saved ~3 GiB of anonymous RAM with recent-edit reuse intact.
  "gemma4-31b-ctx-ckpt": >
    --cache-ram 40960
    --ctx-checkpoints 16
    --checkpoint-min-step 13107

  # Strata on the 2x7900XTX pair: HIP engine, bind mounts only.
  # No --memory cap: upstream advises none (the engine plans from the host's
  # meminfo and the entrypoint warns on memory.max); the engine's 28 GiB resident
  # budget is the actual control. No comgr cache volume: the engine is AOT-built.
  # --group-add takes HOST gids here: Docker resolves names against the image's
  # /etc/group (no render entry, and video is 44 there), so pass the numbers
  # (fedora-tuf: 39/105, `getent group video render`).
  #
  # Keyless by design on a Docker bridge (no host networking). Strata 0.2.2 makes the API
  # key optional, and upstream's entrypoint hardcodes `--access lan` (0.0.0.0).
  # deploy/strata/entrypoint-local.sh adds `--no-api-key` when no key is set, so
  # the server listens on 0.0.0.0 inside its own network namespace and Docker
  # publishes only 127.0.0.1:${PORT} on the host, where this proxy reaches it.
  # No `--network host`. `launch` stores no key, so the swap needs no apiKeys and
  # clients need no header; nothing on the LAN can reach Strata except through
  # llama-swap.
  # --entrypoint replaces the image's `tini -- /opt/strata/entrypoint.sh`; docker's
  # --init keeps PID1 signal forwarding/reaping, and the fork traps SIGTERM and runs
  # `strata launch --stop` exactly like upstream.
  # See notes/strata.md (llama-swap wiring) for the record and the
  # verification list.
  # STRATA_HIPBLASLT_TABLE must be a container env var; inside STRATA_SET it is
  # silently ignored (measured 2026-10-21).
  # Chat template: Strata has no --chat-template-file; it reads the template that
  # setup extracted into <pack>/tokenizer/chat_template.jinja at every start. The
  # fork replaces that copy with the repo's templates/ checkout (mounted at
  # /templates, like the llama.cpp lanes) when CHAT_TEMPLATE_PATH is set, so the
  # template is per-lane state: each model entry sets its own (a Qwen template
  # update arrives with a git pull + lane restart, no GGUF re-download), and
  # duplicate `-e` flags must not decide which one wins.
  "docker-server-strata-rocm": >
    docker run --name ${MODEL_ID} --init --rm
      -p 127.0.0.1:${PORT}:${PORT}
      --entrypoint /entry-local.sh
      --device /dev/kfd --device /dev/dri
      --group-add 39 --group-add 105
      --security-opt label=disable --security-opt seccomp=unconfined
      --ulimit memlock=-1:-1 --shm-size 2g --stop-timeout 120
      -e PORT=${PORT}
      -e STRATA_HIPBLASLT_TABLE=on
      -e STRATA_ALLOWED_HOSTS=fedora-tuf
      -v /mnt/unenc-xfs/llm-ops/deploy/strata/entrypoint-local.sh:/entry-local.sh:ro
      -v /mnt/unenc-xfs/llm-ops/templates:/templates:ro
      -v /mnt/unenc-xfs/models:/models:z

  # The Maya macro: the entrypoint serves the newest /data/config/maya-*-hip.json. The entrypoint itself is also
  # repo-carried: deploy/maya/entrypoint.sh is bind-mounted over the image's (the same file, 755 in git), so an
  # entrypoint change ships with a git pull + lane restart instead of a ~30 GB image rebuild - the maya analogue of
  # the strata fork mount. The engine settings are carried by the REPO, one folder per lane under
  # deploy/maya/configs/ (named after the model id): each model entry mounts its own folder read-only and sets
  # CONFIG_SRC (the entrypoint copies it into /data/config at every start) - the declared state, like the
  # strata fork's STRATA_SET - and prints a summary when the live config it replaces had changed (maya.py rewrites
  # the config on schema migrations after an upstream bump; the dashboard edits it). maya.py touches the config on
  # every start, so a repo file must never be mounted writable straight into /data/config - a rewrite would dirty
  # the checkout and break the runner's git pull. Dashboard edits last until the next lane restart. No model ships
  # in the image: each lane mounts its own data tree at /data (one per model, the strata pattern) plus the model's
  # shard folder read-only at /data/model; with PACK_BUILD=1 the entrypoint builds the vision tower and the pack
  # into /data when they are missing, so a fresh data tree self-provisions at the first start (recipe and checks:
  # notes/maya.md 20261104). Everything the container writes stays in /data (mount, not image).
  "docker-server-maya-rocm": >
    docker run --name ${MODEL_ID} --init --rm
      -p 127.0.0.1:${PORT}:${PORT}
      --device /dev/kfd --device /dev/dri
      --group-add 39 --group-add 105
      --security-opt label=disable --security-opt seccomp=unconfined
      --ulimit memlock=-1:-1 --shm-size 2g --stop-timeout 120
      -e PORT=${PORT}
      -v /mnt/unenc-xfs/llm-ops/deploy/maya/entrypoint.sh:/entrypoint.sh:ro

# apiKeys: require an API key when making requests to inference endpoints
# - optional, default: []
# - when empty (the default) authorization will not be checked as llama-swap is default-allow
# - each key is a non-empty string
#
# Home LAN, single user: default-allow, no key. This is also what keeps the web
# UIs usable — a browser navigating to /upstream/<model>/ cannot attach a Bearer
# header, and Strata only reads Bearer/x-api-key (never Basic), so any apiKeys
# value breaks the Strata UI through the proxy. The Strata container itself is
# keyless behind a loopback-published bridge port (see its macro) and is not
# reachable from the LAN.
apiKeys: []

# models: a dictionary of model configurations
# - required
# - each key is the model's ID, used in API requests
# - model settings have default values that are used if they are not defined here
# - the model's ID is available in the ${MODEL_ID} macro, also available in macros defined above
# - below are examples of the all the settings a model can have
models:
  "google-gemma-4-26b-a4b-q80-vision":
    name: "Gemma 4 26B A4B Q8_0 vision"
    description: "256K context x 2 slots, vision on GPU (image 560 tokens)"
    cmd: |
      ${docker-server-rocm}
        ${gemma4-26b-ctx-ckpt}
        --model                 /models/gemma-4/google-26B-A4B-it/google_gemma-4-26B-A4B-it-Q8_0.gguf
        --mmproj                /models/gemma-4/google-26B-A4B-it/mmproj-google_gemma-4-26B-A4B-it-bf16.gguf
        --chat-template-file /templates/gemma-4/26B-chat-template.jinja
        --jinja --reasoning on --reasoning-preserve
        -b 2048 -ub 768
        --image-min-tokens 560 --image-max-tokens 560
        -ngl 99
        --main-gpu 0 --split-mode layer --tensor-split 16,15
        --ctx-size 524288
        --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0.0 --repeat-penalty 1.0
        --load-mode dio
        --no-kv-unified
        --flash-attn on
        --parallel 2
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    concurrencyLimit: 5
    filters:
      # :npt alias strips historical <think> blocks via per-request
      # chat_template_kwargs. Base ID keeps the preserve default.
      setParamsByID:
        "${MODEL_ID}:npt":
          chat_template_kwargs:
            preserve_thinking: false
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 0
      tlsHandshake: 10
      idleConn: 90


  # The official QAT Q4 for Gemma 4 31B
  "google-gemma-4-31b-qat-q40-vision":
    name: "Google Gemma 4 31B QAT Q4_0 vision"
    description: "256K context, vision on GPU (image 560 tok)"
    cmd: |
      ${docker-server-rocm}
        ${gemma4-31b-ctx-ckpt}
        --model                 /models/gemma-4/google-31B-it-qat-q40-unsloth/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
        --mmproj                /models/gemma-4/google-31B-it-qat-q40-unsloth/mmproj-BF16.gguf
        --chat-template-file /templates/gemma-4/31B-chat-template.jinja
        --jinja --reasoning on --reasoning-preserve
        -b 2048 -ub 768
        --image-min-tokens 560 --image-max-tokens 560
        -ngl 99
        --main-gpu 0 --split-mode layer --tensor-split 31,30
        --ctx-size 262144
        --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0.0 --repeat-penalty 1.0
        --load-mode dio
        --no-kv-unified
        --flash-attn on
        --parallel 1
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    concurrencyLimit: 5
    filters:
      # :npt alias strips historical <think> blocks via per-request
      # chat_template_kwargs. Base ID keeps the preserve default.
      setParamsByID:
        "${MODEL_ID}:npt":
          chat_template_kwargs:
            preserve_thinking: false
    timeouts:
      connect: 30
      keepalive: 30
      # pp may take a long time so we don't set a timeout here
      responseHeader: 0
      tlsHandshake: 10
      idleConn: 90


  # OpenJev, based on Qwen3.8 27B
  # the base model supports 256k context, but the fine tune model
  # is only validated for up to 16k. Longer context may not work.
  # The unified kv pool is 128k, so we can have more VRAM for pp
  # for slower latency.
  # Note about sampling parameters: read from GGUF.
  #   For example: qwen35.decision.temperature.*
  "openjev-q80-vision":
    name: "OpenJev Q8_0 vision"
    description: "128k context, 16K per slot, vision on GPU"
    cmd: |
      ${docker-server-rocm}
        --cache-ram 0
        --ctx-checkpoints 0
        --no-cache-idle-slots
        --model                 /models/openjev/ggml-gguf/OpenJev-Q8_0.gguf
        --mmproj                /models/openjev/ggml-gguf/mmproj-OpenJev-BF16.gguf
        --chat-template-file /templates/openjev/chat-template.jinja
        --jinja
        -b 2048 -ub 256
        --image-min-tokens 1024 --image-max-tokens 8192
        -ngl 99
        --main-gpu 0 --split-mode layer --tensor-split 32,33
        --ctx-size 131072
        --parallel 8
        --load-mode dio
        --no-kv-unified
        --flash-attn on
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    concurrencyLimit: 16
    timeouts:
      connect: 30
      keepalive: 30
      # pp may take a long time so we don't set a timeout here
      responseHeader: 0
      tlsHandshake: 10
      idleConn: 90


  # Qwen3.8 Flash-Next IQ3_S on Strata.
  # Picture reader budget (entrypoint fork change 4): 8192 image tokens at most,
  # 1024 at least — one token per 1024 px, so a 4K picture fits. See notes/strata.md.
  # DRAFTING=mtp pins the drafter explicitly (entrypoint fork change 5): upstream
  # Auto would pick the same here, but a pin cannot change under a later upgrade.
  # DFlash2 was tried on 0.1.56 (2026-11-03) and REVERTED: it cannot run beside
  # --pipeline-windows (its plan treats the flag as "several requests at once",
  # and that flag is our big pp win). The A/B on this pair: DFlash2 60% pp/tg
  # 2100.5/54.80, 85% 2170.9/52.65 vs 1993.1/65.00 and 2119.2/64.30 on the MTP
  # arm the same day (0.2.8: 2038.8/65.50, 2122.1/62.30) — decode 16-18% slower,
  # prompt within noise. 0.2.11 lets a named DFlash2 serve several requests (a
  # drafter per request) but still refuses beside --pipeline-windows. If a later
  # release lifts that, re-test: set DRAFTING=dflash2 and drop
  # pipeline-windows=2/spec-min-p=0.7 from STRATA_SET.
  "qwen3.8-flash-next-iq3s":
    name: "Qwen3.8 Flash-Next IQ3_S"
    description: "262144 ctx, F16 KV, Strata layer split over 2x7900XTX, fully resident @28 GiB, MTP, image 1024-8192 tok"
    cmd: |
      ${docker-server-strata-rocm}
        -v /mnt/unenc-xfs/strata/ISTA-DASLab-Flash-Next:/data
        -e MODEL=IQ3_S
        -e CONTEXT=256k
        -e GPUS=0,1
        -e PARALLEL=1
        -e MODEL_PATH=/models/strata/ISTA-DASLab-Flash-Next
        -e CHAT_TEMPLATE_PATH=/templates/qwen3.8/Flash-Next-chat-template.jinja
        -e VISION_TOKENS=8192
        -e VISION_MIN_TOKENS=1024
        -e DRAFTING=mtp
        -e STRATA_SET="kv=fp16 vram-reserve-mib=1536 vram-reserve-later-mib=1024 resident-budget-gib=28 prompt-cache-spread=on conversation-cache-mib=8192 conversation-cache-slots=8 pipeline-windows=2 layer-split=26 trim-stage-weights=on spec-min-p=0.7 STRATA_SCORES_THREAD=1"
        ghcr.io/hurui200320/llm-ops-strata:0.2.12-rocm-gfx110x
    cmdStop: docker stop -t 120 ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    # The graceful stop llama-swap allows is bounded by this value, so the
    # 120 s `docker stop` fits inside it with room to spare.
    healthCheckTimeout: 600
    concurrencyLimit: 20
    # Declared instead of probed: llama-swap picks its prober from the `owned_by`
    # field of the upstream's /v1/models, and Strata's listing omits it — so
    # discovery falls back to the listing-only prober and would advertise
    # context + text but drop tools and image. Strata's /props IS llama.cpp-shaped
    # (`chat_template_caps`, `modalities`: measured 2026-10-21), so a future
    # upstream that reports `owned_by: llamacpp` would make probing complete.
    # Values here are from that live /props (tools on, GPU vision, n_ctx 262144).
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 262144
      disableAuto: true
    filters:
      # Qwen3.8-style templates honour preserve_thinking, so chat_template_kwargs
      # filters work 1:1 with the llama.cpp models above. Verify once against the
      # pack's template (an unused kwarg is a no-op, not an error).
      setParamsByID:
        "${MODEL_ID}:npt":
          chat_template_kwargs:
            preserve_thinking: false
    timeouts:
      connect: 30
      keepalive: 30
      # pp may take a long time so we don't set a timeout here
      responseHeader: 0
      tlsHandshake: 10
      idleConn: 90


  # SC117 abliterated (uncensored) transplant of the same ISTA GSQ-RCO IQ3_S.
  # Same picture-reader budget and the same MTP arm (DRAFTING=mtp) as the vanilla
  # lane — DFlash2 was tried and reverted; see there for the numbers and the
  # future re-test path.
  "qwen3.8-flash-next-sc117-iq3s":
    name: "Qwen3.8 Flash-Next SC117 IQ3_S (abliterated)"
    description: "262144 ctx, F16 KV, Strata layer split over 2x7900XTX, uncensored, MTP; image 1024-8192 tok"
    cmd: |
      ${docker-server-strata-rocm}
        -v /mnt/unenc-xfs/strata/sc117-Flash-Next-uncensored:/data
        -e MODEL=IQ3_S
        -e CONTEXT=256k
        -e GPUS=0,1
        -e PARALLEL=1
        -e MODEL_PATH=/models/strata/sc117-Flash-Next-uncensored
        -e CHAT_TEMPLATE_PATH=/templates/qwen3.8/Flash-Next-chat-template.jinja
        -e VISION_TOKENS=8192
        -e VISION_MIN_TOKENS=1024
        -e DRAFTING=mtp
        -e STRATA_SET="kv=fp16 vram-reserve-mib=1536 vram-reserve-later-mib=1024 resident-budget-gib=28 prompt-cache-spread=on conversation-cache-mib=8192 conversation-cache-slots=8 pipeline-windows=2 layer-split=26 trim-stage-weights=on spec-min-p=0.7 STRATA_SCORES_THREAD=1"
        ghcr.io/hurui200320/llm-ops-strata:0.2.12-rocm-gfx110x
    cmdStop: docker stop -t 120 ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    healthCheckTimeout: 600
    concurrencyLimit: 20
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 262144
      disableAuto: true
    filters:
      # Same pack template as vanilla (9,993 chars); the :npt alias is identical.
      setParamsByID:
        "${MODEL_ID}:npt":
          chat_template_kwargs:
            preserve_thinking: false
    timeouts:
      connect: 30
      keepalive: 30
      # pp may take a long time so we don't set a timeout here
      responseHeader: 0
      tlsHandshake: 10
      idleConn: 90


  # DeepSeek-V4.1-Flash 1017 IQ2_XXS, maya. Per-model data tree (the strata pattern): everything derived - config,
  # pack, vision tower - lives in the lane's own /data, and the GGUFs are read in place from the production folder,
  # mounted READ-ONLY at /data/model: no hard links, no copies (the pack's ds4.txt records model_dir /data/model and
  # the engine opens the shards through it; the pack itself lives in /data/pack/maya-ds4). PACK_BUILD=1 builds what
  # is missing at every start - the vision tower from the mount's mmproj, the pack from the shards' headers - so a
  # fresh data tree self-provisions and a deleted pack or tower is rebuilt; a restart only stats.
  # Why /data/model INSIDE the writable data tree instead of a shared /models mount like the strata lanes': the
  # pack records the vision tower's file relative to the model dir - pack_gguf.py writes ../vision/vision.bin into
  # the pack (the path is taken from --vision at pack time and resolved against model_dir at every load; there is
  # no engine flag for it) - so a WRITABLE "vision" folder must sit beside the model dir inside the container. The
  # shared models folder cannot host it: the mount would have to be read-only (the production tree is shared state)
  # and vision.bin is derived from the mmproj, i.e. built state that belongs in the lane's data tree. Mounting the
  # shards at /data/model keeps ../vision inside /data (resolved to /data/vision) and the production folder
  # untouched; the entrypoint normalizes ds4.txt's model_dir to /data/model, so even a host-side rebuilt pack
  # resolves here.
  # The engine settings are version-controlled in a lane-private folder, deploy/maya/configs/dsv41f1017-iq2xxs/:
  # each maya lane mounts only its own config folder and points CONFIG_SRC at it (the macro mounts none), so a
  # second config can never take the other lane over on its next restart.
  # Vision: the tower runs in-engine (~318 MiB of VRAM only for a picture turn, out of the reserve);
  # DS4_VISION_TOKENS=1140 is the tower's hard maximum (10,240-patch attention), written into the pack's ds4.txt by
  # the entrypoint at every start (the strata fork's change 6, mirrored). Maya's pack default 1024 downscales a 4K
  # screenshot to 1680x966; 1140 is the tower's ceiling (1840x1008 effective for 16:9).
  "dsv41f1017-iq2xxs":
    name: "DeepSeek V4.1-Flash ISTA-DAS 2.00 bpw"
    description: "524288 ctx, maya-ds4, fixed kv cache quant, vision"
    cmd: |
      ${docker-server-maya-rocm}
        -v /mnt/unenc-xfs/maya/dsv41f1017-iq2xxs:/data
        -v /mnt/unenc-xfs/models/maya/ISTA-DASLab-dsv41f1017:/data/model:ro
        -v /mnt/unenc-xfs/llm-ops/deploy/maya/configs/dsv41f1017-iq2xxs:/repo-configs-ds4:ro
        -e CONFIG_SRC=/repo-configs-ds4
        -e PACK_BUILD=1
        -e DS4_VISION_TOKENS=1140
        ghcr.io/hurui200320/llm-ops-maya:1.1.56-rocm-gfx1100
    cmdStop: docker stop -t 120 ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    # Cold start ~25-40 s (the engine pre-fills its 36 GB store at load); llama-swap also bounds the
    # graceful stop by this value, so -t 120 fits.
    healthCheckTimeout: 600
    concurrencyLimit: 20
